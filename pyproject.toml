[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "spicetrellis"
version = "0.5.0"
description = "A provenance-preserving front end for hierarchical SPICE decks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Weiping Yan" }]
keywords = ["spice", "eda", "netlist", "parser", "circuit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.8",
  "build==1.6.0",
  "coverage[toml]>=7.6",
  "hatchling==1.32.0",
  "jsonschema>=4.23",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "twine==7.0.0",
]

[project.scripts]
spice-trellis = "spicetrellis.cli:entrypoint"

[project.urls]
Documentation = "https://github.com/appleweiping/SpiceTrellis#readme"
Issues = "https://github.com/appleweiping/SpiceTrellis/issues"
Source = "https://github.com/appleweiping/SpiceTrellis"

[tool.hatch.build.targets.wheel]
packages = ["src/spicetrellis"]

[tool.hatch.build.targets.wheel.force-include]
"docs/schemas/circuit-ir-v1.schema.json" = "spicetrellis/schemas/circuit-ir-v1.schema.json"
"docs/schemas/simulation-result-v1.schema.json" = "spicetrellis/schemas/simulation-result-v1.schema.json"

[tool.hatch.build.targets.sdist]
include = [
  "/.github/workflows",
  "/.github/allowed_signers",
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/interop",
  "/corpus",
  "/benchmarks",
  "/tools",
  "/*.md",
  "/CITATION.cff",
  "/LICENSE",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["spicetrellis"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.bandit]
targets = ["src"]
