name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11", quality: true}
          - {os: ubuntu-latest, python-version: "3.12", quality: false}
          - {os: ubuntu-latest, python-version: "3.13", quality: false}
          - {os: ubuntu-latest, python-version: "3.14", quality: false}
          - {os: windows-latest, python-version: "3.11", quality: false}
          - {os: windows-latest, python-version: "3.14", quality: false}
          - {os: macos-latest, python-version: "3.11", quality: false}
          - {os: macos-latest, python-version: "3.14", quality: false}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check uv==0.11.21
      - run: uv sync --frozen --extra dev
      - if: matrix.quality
        run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
      - if: matrix.quality
        run: uv run --frozen mypy --python-version 3.11 src
      - if: matrix.quality
        run: uv run --frozen bandit -q -r src
      - run: uv run --frozen pytest --cov=spicetrellis --cov-report=term-missing
      - if: matrix.quality
        run: uv run --frozen python -m build

  ngspice-results:
    name: Real ngspice result oracles
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the fixed Ubuntu 24.04 ngspice package
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ngspice=42+ds-3build1
      - name: Install the frozen Python project
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.21
          uv sync --frozen
      - name: Check OP, DC, complex AC and transient analytical oracles
        run: uv run --frozen python tools/check_ngspice_results.py --ngspice /usr/bin/ngspice

  circuit-ir-go:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, coverage: true}
          - {os: windows-latest, coverage: false}
          - {os: macos-latest, coverage: false}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: interop/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: interop/go/go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - if: matrix.coverage
        name: Enforce Go coverage floor
        shell: bash
        run: |
          go test -coverprofile="$RUNNER_TEMP/circuit-ir.coverage" ./...
          read -r covered total < <(
            awk 'NR > 1 { total += $2; if ($3 > 0) covered += $2 }
                 END { print covered + 0, total + 0 }' "$RUNNER_TEMP/circuit-ir.coverage"
          )
          echo "Go statement coverage: $covered/$total"
          awk -v covered="$covered" -v total="$total" \
            'BEGIN { if (total == 0 || covered * 100 < total * 90) exit 1 }'

  circuit-ir-cross-language:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: interop/go/go.mod
          cache: false
      - run: python -m pip install --disable-pip-version-check uv==0.11.21
      - run: uv sync --frozen
      - name: Produce with Python and consume with Go
        shell: bash
        run: |
          uv run --frozen spice-trellis export-ir tests/fixtures/valid/top.sp \
            --include-root tests/fixtures/valid --compact -o "$RUNNER_TEMP/producer.ir.json"
          (cd interop/go && go run ./cmd/circuitir-check "$RUNNER_TEMP/producer.ir.json") \
            > "$RUNNER_TEMP/go-summary.json"
          uv run --frozen python -I - "$RUNNER_TEMP/producer.ir.json" "$RUNNER_TEMP/go-summary.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          from spicetrellis import load_ir

          circuit = load_ir(sys.argv[1])
          summary = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if summary["fingerprint"] != circuit.fingerprint:
              raise SystemExit("Python and Go fingerprints differ")
          if summary["instances"] != circuit.instance_count:
              raise SystemExit("Python and Go instance counts differ")
          print(f"cross-language fingerprint verified: {circuit.fingerprint}")
          PY
      - name: Produce physical JSON with Python and consume with Go
        shell: bash
        run: |
          uv run --frozen python -I examples/physical_library.py \
            "$RUNNER_TEMP/producer.physical.json"
          (cd interop/go && go run ./cmd/physicalir-check \
            "$RUNNER_TEMP/producer.physical.json") > "$RUNNER_TEMP/go-physical-summary.json"
          uv run --frozen python -I - "$RUNNER_TEMP/producer.physical.json" "$RUNNER_TEMP/go-physical-summary.json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path
          from spicetrellis import load_physical, physical_digest

          wire = Path(sys.argv[1])
          library = load_physical(wire)
          shape_count = 0
          for cell in library.cells:
              if cell.layout is not None:
                  shape_count += len(cell.layout.shapes)
              if cell.abstract is not None:
                  shape_count += len(cell.abstract.blockages)
                  shape_count += sum(len(port.shapes) for port in cell.abstract.ports)
          input_sha256 = hashlib.sha256(wire.read_bytes()).hexdigest()
          if input_sha256 != physical_digest(library):
              raise SystemExit("fresh Python physical output is not canonical")
          expected = {
              "schema": "org.spicetrellis.physical-library",
              "version": 1,
              "library": library.name,
              "libraries": 1,
              "layers": len(library.technology.layers),
              "cells": len(library.cells),
              "shapes": shape_count,
              "input_sha256": input_sha256,
          }
          summary = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if summary != expected:
              raise SystemExit(f"Python and Go physical summaries differ: {summary!r} != {expected!r}")
          print(f"cross-language physical input verified: {input_sha256}")
          PY
