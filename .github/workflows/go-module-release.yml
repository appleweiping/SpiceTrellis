name: Go module release verification

on:
  push:
    tags:
      - "interop/go/v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_PROJECT_VERSION: "0.6.0"

jobs:
  verify-ci:
    name: Require exact signed and tested main commit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify annotated module tag and source commit trust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/interop/go/v*) ;;
            *) echo "Go release workflow must run from a module tag, not $GITHUB_REF" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin main
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          git verify-tag "$GITHUB_REF_NAME"
          resolved="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{}")"
          if [ "$resolved" != "$GITHUB_SHA" ]; then
            echo "module tag target differs from the workflow commit" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Go module release commit is not reachable from origin/main" >&2
            exit 1
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
            --jq .commit.verification.verified)" = true || {
            echo "Go release commit does not have a GitHub-verified signature" >&2
            exit 1
          }
      - name: Wait for the exact complete main-push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            successful="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.conclusion == \"success\" and .event == \"push\" and .head_branch == \"main\" and .head_sha == \"$GITHUB_SHA\")] | length")"
            if [ "$successful" -gt 0 ]; then
              echo "verified successful main-push CI workflow for $GITHUB_SHA"
              exit 0
            fi
            echo "CI has not succeeded yet (attempt $attempt/90)"
            sleep 20
          done
          echo "no successful complete main-push CI workflow found for $GITHUB_SHA" >&2
          exit 1

  verify:
    name: Verify nested Go module
    needs: verify-ci
    if: needs.verify-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: interop/go
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Verify module tag matches project version
        working-directory: .
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -I - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected_version = os.environ["RELEASE_PROJECT_VERSION"]
          if version != expected_version:
              raise SystemExit(
                  f"project version {version!r} does not match workflow version {expected_version!r}"
              )
          expected = f"interop/go/v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(
                  f"module tag {os.environ['RELEASE_TAG']!r} does not match {expected!r}"
              )
          PY
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: interop/go/go.mod
          cache: false
      - name: Run race-enabled Go tests
        run: go test -race ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Enforce Go coverage floor
        shell: bash
        run: |
          set -euo pipefail
          go test -coverprofile="$RUNNER_TEMP/circuit-ir.coverage" ./...
          read -r covered total < <(
            awk 'NR > 1 { total += $2; if ($3 > 0) covered += $2 }
                 END { print covered + 0, total + 0 }' "$RUNNER_TEMP/circuit-ir.coverage"
          )
          echo "Go statement coverage: $covered/$total"
          awk -v covered="$covered" -v total="$total" \
            'BEGIN { if (total == 0 || covered * 100 < total * 90) exit 1 }'
