name: Feature request
description: Propose a focused syntax, diagnostic, or API capability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user-visible limitation without proposing code first.
    validations:
      required: true
  - type: textarea
    id: syntax
    attributes:
      label: Exact syntax or API boundary
      description: Include original, non-proprietary examples and expected diagnostics.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and determinism considerations
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not require executing circuit text or arbitrary code.
          required: true
        - label: Any example data is original and safe to publish.
          required: true
